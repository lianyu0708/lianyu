# Render 一键部署蓝图（免费版）
# 在 https://dashboard.render.com/blueprints 上传本仓库即可
services:
  - type: web
    name: lianyu
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
